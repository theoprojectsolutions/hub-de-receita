<title>Caderno de Treino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna para celular. Tela 1 = calendário do mês; tela 2 = ficha do dia. Azul de anilha marca Upper, vermelho marca Lower. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14181D; --muted:#69727E; --line:#DCE1E7;
  --upper:#1D4ED0; --upper-soft:#E5ECFB; --lower:#C3302A; --lower-soft:#F9E6E4;
  --ok:#1B8048; --ok-soft:#E2F3E9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --sunk:#12161B; --ink:#E7EAEE; --muted:#8F98A3; --line:#272D35;
  --upper:#7C9BFF; --upper-soft:#1B2541; --lower:#FF7A6E; --lower-soft:#3A1E1C;
  --ok:#47C985; --ok-soft:#15301F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --sunk:#12161B; --ink:#E7EAEE; --muted:#8F98A3; --line:#272D35;
  --upper:#7C9BFF; --upper-soft:#1B2541; --lower:#FF7A6E; --lower-soft:#3A1E1C;
  --ok:#47C985; --ok-soft:#15301F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--upper);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
.up{--k:var(--upper);--k-soft:var(--upper-soft)}
.lo{--k:var(--lower);--k-soft:var(--lower-soft)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.title span{color:var(--muted);font-weight:600}
.nav{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;line-height:1;padding:0 10px}
.status{font-size:12px;color:var(--muted);margin:0}

/* Card de hoje */
.today{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%}
.today .dot{width:12px;height:12px;border-radius:50%;background:var(--k,var(--muted));flex:none}
.today div{flex:1;min-width:0}
.today small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.today strong{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.today .go{font-weight:600;color:var(--k,var(--muted));font-size:14px;white-space:nowrap}

/* Calendário */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-block:4px 6px}
.cell{aspect-ratio:1/1.15;max-width:100%;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cell b{font-family:var(--display);font-weight:600;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.cell i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--k);line-height:1}
.cell.train{background:var(--k-soft)}
.cell.rest b{color:var(--muted);font-weight:500}
.cell.out{visibility:hidden}
.cell.done{background:var(--k)}
.cell.done b,.cell.done i{color:var(--surface)}
.cell.part i::after{content:" •"}
.cell.now{box-shadow:inset 0 0 0 2px var(--ink)}
.sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:8px 4px 2px}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Ficha do dia */
.back{border:0;background:none;padding:6px 0;color:var(--muted);font-weight:600;font-size:14px;align-self:flex-start}
.dayhead h1{margin:0;font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;text-transform:uppercase;color:var(--k)}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.dayhead p b{color:var(--ink);font-variant-numeric:tabular-nums}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px}
.ex.complete{border-color:var(--ok)}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex h2{margin:0;font-size:16.5px;font-weight:700;line-height:1.25;min-width:0}
.ex h2 span{color:var(--muted);font-family:var(--display);font-weight:600;margin-right:6px}
.info{border:0;background:none;color:var(--muted);font-size:13px;padding:0;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.ex .presc{font-size:13px;color:var(--muted);margin-top:2px}
.ex .presc b{color:var(--ink);font-weight:600}
.ex .tip{font-size:13px;color:var(--muted);margin-top:6px}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:8px;align-items:center}
.row .lbl{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted);text-align:center}
.row.warm .lbl{font-size:13px}
.row input{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:0 8px;font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.row.warm input{height:38px;font-size:15px}
.row input::placeholder{color:var(--muted);opacity:.5;font-weight:500;font-size:14px}
.tick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;color:transparent;display:grid;place-items:center}
.row.warm .tick{height:38px}
.row.ok .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.row.ok input{background:var(--ok-soft);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.2;text-align:left}
.pill.up,.pill.lo{color:var(--k)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.swap{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.swap .pill{text-transform:none;letter-spacing:0;color:var(--ink)}
.swap .pill[aria-pressed="true"]{color:var(--surface)}
.restday .chips{margin-top:8px}
.vol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px}
.vol-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.vol-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.vol-i{display:flex;flex-direction:column;gap:3px;min-width:0}
.vol-i span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol-i b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.vol-i b small{font-size:14px;color:var(--muted);font-weight:500}
.vol-i i{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.vol-i u{display:block;height:100%;background:var(--upper);text-decoration:none}
.vol-i.hit u{background:var(--ok)}
.vol-i em{font-style:normal;font-size:11px;color:var(--muted)}
.own{display:flex;gap:6px;margin-top:2px}
.own input{flex:1;min-width:0;height:36px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:0 14px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.adj{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.adj b{font-family:var(--display);font-size:22px;color:var(--ink);min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.adj input{width:96px;height:32px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;text-align:center;font-weight:600}
.adj span:nth-of-type(2){margin-left:10px}
.step{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
[data-reset]{margin-top:8px}
.rest-edit{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px}
.rest-edit input{width:64px;height:30px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;font-size:15px}
.restday{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px}
.restday h1{margin:0;font-family:var(--display);font-size:40px;text-transform:uppercase;line-height:1}
.restday p{margin:6px 0 0;color:var(--muted)}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--surface);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .clock{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;flex:1}
.timer button{border:1px solid rgba(127,127,127,.5);background:transparent;color:inherit;border-radius:10px;height:40px;padding:0 14px;font-weight:600}
.timer .prog{position:absolute;top:0;left:0;height:3px;background:var(--ok)}
.timer.over .clock{color:var(--ok)}
</style>

<div class="wrap" id="app"><p class="status">Carregando…</p></div>

<div class="timer" id="timer" hidden>
  <div class="prog" id="tProg"></div>
  <div class="in">
    <div class="clock" id="tClock">0:00</div>
    <button id="tAdd">+15s</button>
    <button id="tStop">Pular</button>
  </div>
</div>

<script>
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['seg','ter','qua','qui','sex','sab','dom'];
const DOW_LBL = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
let P = null; // programa.json

/* ---------- Datas ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const dowKey = d => DOW[(d.getDay()+6)%7];
const TODAY = iso(new Date());
const scheduled = s => P.semana[dowKey(parse(s))] || null;
/* treino do dia: o da semana, ou o que você escolheu para aquele dia */
const workoutOn = s => { const r = S.days[s]; const id = (r && 'escolha' in r) ? r.escolha : scheduled(s); return id && P.treinos[id] ? Object.assign({id}, P.treinos[id]) : null; };
const kind = w => w && w.tipo === 'lower' ? 'lo' : 'up';
const fmtLong = s => { const d = parse(s); return DOW_LBL[(d.getDay()+6)%7]+', '+d.getDate()+' de '+MONTHS[d.getMonth()].toLowerCase(); };
const fmtTime = sec => { sec = Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+pad(sec%60); };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Estado ---------- */
const S = { month: TODAY.slice(0,7), days:{}, mode:'loading', open:{}, statusText:'' };
const LS = 'caderno-treino-v2';
try { S.days = JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){}
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(S.days)); } catch(e){} };

function dayRec(s, create){
  let d = S.days[s];
  if (!d && create){ const w = workoutOn(s); d = S.days[s] = {treino: w ? w.id : null, ex:{}, note:''}; }
  if (d) d.ex = d.ex || {};
  return d || null;
}
/* linhas de um exercício: aquecimento (só nos compostos) + séries válidas */
function rowsFor(e){
  const rows = e.tipo === P.aquecimento.so_em ? [{rotulo:P.aquecimento.rotulo, warm:true}] : [];
  for (let i=1;i<=e.series;i++) rows.push({rotulo:String(i), warm:false});
  return rows;
}
const blank = () => ({kg:'',r:'',ok:false});
function exRec(s, e, create){
  const d = dayRec(s, create); if (!d) return null;
  if (!d.ex[e.id] && create) d.ex[e.id] = {rest:'', sets:[]};
  const r = d.ex[e.id]; if (!r) return null;
  if (create) while (r.sets.length < rowsFor(e).length) r.sets.push(blank());
  return r;
}
/* séries válidas feitas e planejadas no dia, por grupo muscular */
function dayVolume(s, acc){
  const w = workoutOn(s); if (!w) return;
  const d = dayRec(s,false);
  w.exercicios.forEach((_,i)=>{
    const e = exFor(s,w,i), rows = rowsFor(e), r = d && d.ex[e.id];
    rows.forEach((row,ri)=>{
      if (row.warm) return;
      const ok = !!(r && r.sets[ri] && r.sets[ri].ok);
      e.musculos.forEach(m=>{ acc[m] = acc[m] || {plan:0, done:0}; acc[m].plan++; if (ok) acc[m].done++; });
    });
  });
}
function progress(s){
  const w = workoutOn(s); if (!w) return null;
  let total = 0, done = 0;
  const d = dayRec(s,false);
  w.exercicios.forEach((_,i)=>{
    const e = exFor(s,w,i), n = rowsFor(e).length, r = d && d.ex[e.id];
    total += n; if (r) done += r.sets.slice(0,n).filter(x=>x.ok).length;
  });
  return {done, total};
}
/* exercício de cada posição: escolha do dia, senão a última variação usada nesse treino, senão o original */
/* valor de uma posição do treino: o do dia, senão o último usado nesse treino */
function inherited(s, w, field, i){
  const r = S.days[s];
  if (r && r[field] && r[field][i] != null) return r[field][i];
  let best = null;
  for (const k in S.days){ const d = S.days[k]; if (k < s && d.treino === w.id && d[field] && d[field][i] != null && (!best || k > best)) best = k; }
  return best ? S.days[best][field][i] : null;
}
const slug = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
/* exercício de cada posição: troca/ajuste do dia, senão a última escolha nesse treino, senão o original */
function exFor(s, w, i){
  const base = w.exercicios[i];
  const opts = [{id:base.id, nome:base.nome, dica:base.dica}].concat(base.alternativas || []);
  const pick = inherited(s, w, 'trocas', i);
  let o, custom = false;
  if (pick && pick.indexOf('custom:') === 0){
    const nome = pick.slice(7); custom = true;
    o = {id:'c-'+slug(nome), nome, dica:'Exercício que você cadastrou.'};
  } else o = opts.find(x=>x.id===pick) || opts[0];
  const aj = inherited(s, w, 'ajustes', i) || {};
  return Object.assign({}, o, {tipo: base.tipo, series: aj.series || base.series, reps: aj.reps || base.reps,
    baseSeries: base.series, baseReps: base.reps, alvo: base.alvo, musculos: base.musculos, opts, custom});
}
/* últimos números registrados para este exercício antes desta data */
function lastFor(s, exId){
  let best = null;
  for (const k in S.days){
    const r = S.days[k].ex && S.days[k].ex[exId];
    if (k < s && r && r.sets && r.sets.some(x=>x.kg||x.r) && (!best || k > best)) best = k;
  }
  return best ? S.days[best].ex[exId] : null;
}

/* ---------- Nuvem: cada dia é um documento privado ---------- */
let col = null; const timers = new Map(); const dirty = new Set(); let chain = Promise.resolve();
function status(t){ S.statusText = t; const el = document.getElementById('status'); if (el) el.textContent = t; }
function save(s){
  if (S.days[s]){ const w = workoutOn(s); S.days[s].treino = w ? w.id : null; }
  saveLocal();
  if (S.mode !== 'cloud'){ status('Salvo neste aparelho'); return; }
  dirty.add(s); status('Salvando…');
  clearTimeout(timers.get(s));
  timers.set(s, setTimeout(()=>{
    timers.delete(s);
    const body = JSON.parse(JSON.stringify(S.days[s]));
    chain = chain.then(()=>col.doc(s).set(body)).then(()=>{
      if (!timers.has(s)) dirty.delete(s);
      if (!timers.size) status('Salvo na nuvem');
    }).catch(()=>status('Não salvou na nuvem; ficou neste aparelho'));
  }, 700));
}
async function initCloud(){
  try{
    if (!window.claude || !window.claude.use) throw 0;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) throw 0;
    col = db.collection('data/users/'+uid);
    let first = true;
    const slow = setTimeout(()=>{ if (first) status('Sem resposta da nuvem; salvando neste aparelho'); }, 10000);
    col.onSnapshot(snap=>{
      if (first && snap.metadata.fromCache) return;
      const remote = {};
      snap.docs.forEach(d=>{ if (/^\d{4}-\d{2}-\d{2}$/.test(d.id)) remote[d.id] = d.data(); });
      for (const id in remote) if (!dirty.has(id)) S.days[id] = JSON.parse(JSON.stringify(remote[id]));
      const wasFirst = first; first = false; clearTimeout(slow); S.mode = 'cloud';
      if (wasFirst){ for (const id in S.days) if (!(id in remote)) save(id); if (!timers.size) status('Salvo na nuvem'); }
      saveLocal();
      const a = document.activeElement;
      if (!(a && /INPUT|TEXTAREA/.test(a.tagName))) render();
    }, ()=>{ clearTimeout(slow); S.mode = 'local'; status('Nuvem indisponível; salvando neste aparelho'); });
  }catch(e){ S.mode = 'local'; status('Salvo só neste aparelho'); }
}

/* ---------- Telas ---------- */
const app = document.getElementById('app');
function route(){ const m = location.hash.match(/^#d-(\d{4}-\d{2}-\d{2})$/); return m ? m[1] : null; }
function render(){ if (!P) return; const d = route(); d ? renderDay(d) : renderCalendar(); }

function renderCalendar(){
  const [y,m] = S.month.split('-').map(Number);
  const first = new Date(y,m-1,1), lead = (first.getDay()+6)%7, n = new Date(y,m,0).getDate();
  let cells = '', planned = 0, done = 0;
  for (let i=0;i<lead;i++) cells += '<span class="cell out"></span>';
  for (let d=1; d<=n; d++){
    const s = y+'-'+pad(m)+'-'+pad(d), w = workoutOn(s), p = progress(s);
    const cls = ['cell'];
    if (w){ cls.push('train', kind(w)); planned++; if (p.done===p.total){ cls.push('done'); done++; } else if (p.done) cls.push('part'); }
    else cls.push('rest');
    if (s===TODAY) cls.push('now');
    cells += '<button class="'+cls.join(' ')+'" data-open="'+s+'" aria-label="'+fmtLong(s)+(w?', '+w.nome:', descanso')+'"><b>'+d+'</b>'+(w?'<i>'+w.curto+'</i>':'')+'</button>';
  }
  const tw = workoutOn(TODAY), tp = progress(TODAY);
  const todayCard = '<button class="today '+(tw?kind(tw):'')+'" data-open="'+TODAY+'"><span class="dot"></span><div><small>Hoje · '+fmtLong(TODAY)+'</small><strong>'+(tw?tw.nome:'Descanso')+'</strong></div>'
    + '<span class="go">'+(tw ? (tp.done===tp.total?'Feito ✓':tp.done?'Continuar ›':'Começar ›') : '')+'</span></button>';
  app.innerHTML =
    '<div class="bar"><div class="title">'+MONTHS[m-1]+' <span>'+y+'</span></div>'
    + '<div class="nav"><button class="icon-btn" data-m="-1" aria-label="Mês anterior">‹</button><button class="icon-btn" data-m="1" aria-label="Próximo mês">›</button></div></div>'
    + todayCard
    + '<div class="cal"><div class="dow">'+DOW_LBL.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="grid">'+cells+'</div>'
    + '<div class="sum"><span>Treinos feitos no mês</span><b>'+done+' / '+planned+'</b></div></div>'
    + weekPanel()
    + '<p class="status" id="status">'+esc(S.statusText)+'</p>';
}

function weekPanel(){
  const t = parse(TODAY), mon = new Date(t); mon.setDate(t.getDate() - (t.getDay()+6)%7);
  const acc = {};
  for (let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); dayVolume(iso(d), acc); }
  const meta = P.meta_semanal;
  return '<section class="vol"><div class="vol-h"><span>Séries válidas · semana</span><span>meta '+meta+'</span></div><div class="vol-g">'
    + Object.keys(P.grupos).map(g=>{
        const v = acc[g] || {plan:0, done:0};
        const pct = Math.min(100, v.done/meta*100);
        const off = v.plan !== meta ? ' title="Planejado esta semana: '+v.plan+'"' : '';
        return '<div class="vol-i'+(v.done>=meta?' hit':'')+'"'+off+'><span>'+P.grupos[g]+'</span><b>'+v.done+'<small>/'+meta+'</small></b>'
          + '<i><u style="width:'+pct+'%"></u></i>'+(v.plan!==meta?'<em>planejado '+v.plan+'</em>':'')+'</div>';
      }).join('')
    + '</div></section>';
}

function renderDay(s){
  const w = workoutOn(s);
  const d = parse(s);
  let h = '<button class="back" data-back>‹ '+MONTHS[d.getMonth()]+'</button>';
  const cur = w ? w.id : 'rest';
  const picker = '<div class="chips" role="group" aria-label="Escolher treino do dia">'
    + Object.keys(P.treinos).map(id=>'<button class="pill '+kind(P.treinos[id])+'" data-pick="'+id+'" aria-pressed="'+(cur===id)+'">'+esc(P.treinos[id].nome)+'</button>').join('')
    + '<button class="pill" data-pick="rest" aria-pressed="'+(cur==='rest')+'">Descanso</button></div>';
  if (!w){
    const rec = dayRec(s,false);
    h += '<div class="restday"><h1>Descanso</h1><p>'+fmtLong(s)+'. Recupere: sono, proteína e, se quiser, uma caminhada leve.</p>'
      + '<p style="margin-top:14px">Vai treinar hoje? Escolha o treino:</p>'+picker+'</div>'
      + '<textarea id="note-'+s+'" data-note placeholder="Anotações do dia">'+esc(rec&&rec.note||'')+'</textarea>'
      + '<p class="status" id="status">'+esc(S.statusText)+'</p>';
    app.innerHTML = h; return;
  }
  const p = progress(s), rec = dayRec(s,false);
  h += '<div class="dayhead '+kind(w)+'"><h1>'+esc(w.nome)+'</h1><p>'+esc(w.foco)+' · '+fmtLong(s)+' · <b>'+p.done+'/'+p.total+'</b>'
    + ' · <button class="info" data-wtoggle aria-expanded="'+!!S.pickOpen+'">trocar treino</button></p>'
    + (S.pickOpen ? '<div style="margin-top:10px">'+picker+'</div>' : '') + '</div>';
  w.exercicios.forEach((_,i)=>{
    const e = exFor(s,w,i);
    const pr = {descanso: P.descanso[e.tipo]}, r = exRec(s,e,false), lr = lastFor(s, e.id), rows = rowsFor(e);
    const sets = rows.map((_,ri)=> r && r.sets[ri] || blank());
    const complete = sets.every(x=>x.ok);
    const key = s+'-'+e.id;
    const okey = s+'-'+i;
    h += '<article class="ex '+kind(w)+(complete?' complete':'')+'" data-ex="'+e.id+'" data-slot="'+i+'">'
      + '<div class="ex-top"><h2><span>'+(i+1)+'</span>'+esc(e.nome)+'</h2><button class="info" data-info aria-expanded="'+!!S.open[okey]+'">'+(S.open[okey]?'fechar':'alterar')+'</button></div>'
      + '<div class="presc"><b>'+e.series+' × '+esc(e.reps)+'</b>'+(rows[0].warm?' + aquec.':'')+' · '+esc(e.alvo)+' · descanso '+fmtTime((r&&parseInt(r.rest,10))||pr.descanso)+'</div>'
      + (S.open[okey] ? '<div class="tip">'+esc(e.dica)+(rows[0].warm?'<br>Aquecimento: '+esc(P.aquecimento.obs)+'.':'')+'<br>Conta para: '+e.musculos.map(m=>P.grupos[m]).join(' e ')+'.</div>'
          + '<div class="swap"><span>Trocar por</span><div class="chips">'
          + e.opts.map(o=>'<button class="pill" data-swap="'+o.id+'" aria-pressed="'+(!e.custom && o.id===e.id)+'">'+esc(o.nome)+'</button>').join('')
          + (e.custom ? '<button class="pill" aria-pressed="true">'+esc(e.nome)+'</button>' : '')
          + '</div><div class="own"><input id="own-'+okey+'" data-own placeholder="Outro exercício: digite o nome" autocomplete="off"><button class="pill" data-own-ok>Usar</button></div></div>'
          + '<div class="adj"><span>Séries</span><button class="step" data-ser="-1" aria-label="Menos uma série">−</button><b>'+e.series+'</b><button class="step" data-ser="1" aria-label="Mais uma série">+</button>'
          + '<span>Reps</span><input id="reps-'+okey+'" data-reps value="'+esc(e.reps)+'" autocomplete="off" aria-label="Repetições alvo"></div>'
          + ((e.id!==e.opts[0].id || e.custom || e.series!==e.baseSeries || e.reps!==e.baseReps) ? '<button class="info" data-reset>voltar ao original</button>' : '')
          + '<label class="rest-edit">Meu descanso <input id="rest-'+key+'" data-rest inputmode="numeric" value="'+esc(r&&r.rest||'')+'" placeholder="'+pr.descanso+'"> s</label>' : '')
      + '<div class="rows">';
    rows.forEach((sd,si)=>{
      const x = sets[si], lx = lr && lr.sets && lr.sets[si] || {};
      const warm = sd.warm, nm = warm ? 'aquecimento' : 'série '+sd.rotulo;
      h += '<div class="row'+(warm?' warm':'')+(x.ok?' ok':'')+'"><span class="lbl">'+sd.rotulo+'</span>'
        + '<input id="kg-'+key+'-'+si+'" data-f="kg" data-i="'+si+'" inputmode="decimal" autocomplete="off" aria-label="Carga '+nm+'" value="'+esc(x.kg)+'" placeholder="'+esc(lx.kg ? lx.kg+' kg' : 'kg')+'">'
        + '<input id="r-'+key+'-'+si+'" data-f="r" data-i="'+si+'" inputmode="numeric" autocomplete="off" aria-label="Repetições '+nm+'" value="'+esc(x.r)+'" placeholder="'+esc(lx.r ? lx.r+' reps' : 'reps')+'">'
        + '<button class="tick" data-tick="'+si+'" aria-pressed="'+!!x.ok+'" aria-label="Marcar '+nm+' como feita">✓</button></div>';
    });
    h += '</div></article>';
  });
  h += '<textarea id="note-'+s+'" data-note placeholder="Anotações do treino">'+esc(rec&&rec.note||'')+'</textarea>'
    + '<p class="status" id="status">'+esc(S.statusText)+'</p>';
  app.innerHTML = h;
}

/* ---------- Interações ---------- */
app.addEventListener('click', ev=>{
  const t = ev.target;
  const open = t.closest('[data-open]');
  if (open){ location.hash = 'd-'+open.dataset.open; return; }
  const mv = t.closest('[data-m]');
  if (mv){ const [y,m] = S.month.split('-').map(Number); const d = new Date(y, m-1+Number(mv.dataset.m), 1); S.month = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); return; }
  if (t.closest('[data-back]')){ const s = route(); if (s) S.month = s.slice(0,7); location.hash = ''; return; }
  const pick = t.closest('[data-pick]');
  if (pick){
    const s = route(), id = pick.dataset.pick === 'rest' ? null : pick.dataset.pick;
    const rec = dayRec(s, true);
    if (id === scheduled(s)) delete rec.escolha; else rec.escolha = id;
    rec.treino = id; S.pickOpen = false; save(s); render(); return;
  }
  if (t.closest('[data-wtoggle]')){ S.pickOpen = !S.pickOpen; render(); return; }
  const exEl = t.closest('[data-ex]'); if (!exEl) return;
  const s = route(), exId = exEl.dataset.ex, slot = exEl.dataset.slot;
  if (t.closest('[data-info]')){ const k = s+'-'+slot; S.open[k] = !S.open[k]; render(); return; }
  const setSlot = (field, val)=>{ const rec = dayRec(s, true); rec[field] = rec[field] || {}; rec[field][slot] = val; save(s); render(); };
  if (t.closest('[data-own-ok]')){
    const v = exEl.querySelector('[data-own]').value.trim().replace(/\s+/g,' ').slice(0,60);
    if (v) setSlot('trocas', 'custom:'+v); return;
  }
  const ser = t.closest('[data-ser]');
  if (ser){
    const e = exFor(s, workoutOn(s), +slot);
    setSlot('ajustes', {series: Math.max(1, Math.min(10, e.series + Number(ser.dataset.ser))), reps: e.reps}); return;
  }
  if (t.closest('[data-reset]')){
    const base = workoutOn(s).exercicios[+slot], rec = dayRec(s, true);
    rec.trocas = rec.trocas || {}; rec.trocas[slot] = base.id;
    rec.ajustes = rec.ajustes || {}; rec.ajustes[slot] = {series: base.series, reps: base.reps};
    save(s); render(); return;
  }
  const sw = t.closest('[data-swap]');
  if (sw){
    const rec = dayRec(s, true); rec.trocas = rec.trocas || {}; rec.trocas[slot] = sw.dataset.swap;
    save(s); render(); return;
  }
  const tick = t.closest('[data-tick]');
  if (tick){
    const e = exFor(s, workoutOn(s), +slot), r = exRec(s, e, true), i = +tick.dataset.tick, x = r.sets[i];
    if (!x.ok){ // completa campos vazios com o que fez da última vez
      tick.parentElement.querySelectorAll('input').forEach(inp=>{ const v = (inp.placeholder.match(/^[\d.,]+/)||[])[0]; if (!inp.value && v) x[inp.dataset.f] = v; });
    }
    x.ok = !x.ok; save(s); render();
    if (x.ok){
      startTimer(rowsFor(e)[i].warm ? P.aquecimento.descanso : (parseInt(r.rest,10) || P.descanso[e.tipo]));
    }
  }
});
app.addEventListener('input', ev=>{
  const t = ev.target, s = route(); if (!s) return;
  if (t.dataset.note !== undefined){ dayRec(s,true).note = t.value; save(s); return; }
  const exEl = t.closest('[data-ex]'); if (!exEl) return;
  if (t.dataset.own !== undefined) return;
  if (t.dataset.reps !== undefined){
    const e = exFor(s, workoutOn(s), +exEl.dataset.slot), rec = dayRec(s, true);
    rec.ajustes = rec.ajustes || {}; rec.ajustes[exEl.dataset.slot] = {series: e.series, reps: t.value.trim().slice(0,20) || e.baseReps};
    save(s); return;
  }
  const r = exRec(s, exFor(s, workoutOn(s), +exEl.dataset.slot), true);
  if (t.dataset.rest !== undefined) r.rest = t.value.trim();
  else r.sets[+t.dataset.i][t.dataset.f] = t.value.trim();
  save(s);
});
app.addEventListener('change', ev=>{ if (ev.target.dataset.reps !== undefined) render(); });
app.addEventListener('keydown', ev=>{ if (ev.key==='Enter' && ev.target.dataset.own !== undefined){ ev.preventDefault(); ev.target.parentElement.querySelector('[data-own-ok]').click(); } });
window.addEventListener('hashchange', ()=>{ S.pickOpen = false; render(); window.scrollTo(0,0); });

/* ---------- Cronômetro ---------- */
let tEnd=0, tTot=0, tInt=null, buzzed=false;
const $ = id => document.getElementById(id);
function startTimer(sec){ tTot=sec; tEnd=Date.now()+sec*1000; buzzed=false; $('timer').hidden=false; clearInterval(tInt); tick(); tInt=setInterval(tick,250); }
function tick(){
  const left = (tEnd-Date.now())/1000;
  $('timer').classList.toggle('over', left<=0);
  if (left<=0){
    $('tClock').textContent = 'Bora! +'+fmtTime(-left); $('tProg').style.width='100%';
    if (!buzzed){ buzzed=true; try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} beep(); }
    if (left < -60) stopTimer();
  } else { $('tClock').textContent = fmtTime(left); $('tProg').style.width = (100-left/tTot*100)+'%'; }
}
function stopTimer(){ clearInterval(tInt); $('timer').hidden = true; }
$('tStop').onclick = stopTimer;
$('tAdd').onclick = ()=>{ tEnd+=15000; tTot+=15; buzzed=false; tick(); };
let actx=null;
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=.08; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.25); }catch(e){} }

/* ---------- Início: o programa vem de programa.json ---------- */
fetch('programa.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(j=>{
  P = j; render(); initCloud();
}).catch(()=>{ app.innerHTML = '<p class="status">Não consegui carregar o programa de treino. Recarregue a página.</p>'; });
</script>
